<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vianočný odpočet</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            /* Sýte vianočné tmavozelenomodré pozadie */
            background: linear-gradient(135deg, #062017 0%, #0c3b2e 50%, #03150e 100%);
            font-family: 'Open Sans', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            position: relative;
            overflow: hidden;
        }

        /* Generovanie sneženia pomocou CSS */
        .snow-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .snowflake {
            position: absolute;
            background: #ffffff;
            border-radius: 50%;
            opacity: 0.8;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(-10px) translateX(0);
            }
            50% {
                transform: translateY(50vh) translateX(20px);
            }
            100% {
                transform: translateY(105vh) translateX(-20px);
            }
        }

        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            max-width: 900px;
            width: 100%;
            padding: 20px;
        }

        h1 {
            font-family: 'Mountains of Christmas', cursive;
            font-size: 4.5rem;
            color: #f3f4f6;
            margin-bottom: 30px;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.6);
        }

        /* Priesvitný tmavý box */
        .countdown-box {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 40px 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }

        .time-segment {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }

        .time-value {
            font-size: 5rem;
            font-weight: 700;
            line-height: 1;
            color: #ffffff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.4);
        }

        /* Sekundy v ružovej farbe */
        .time-segment.seconds .time-value {
            color: #f43f5e; 
        }

        .time-label {
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 15px;
            color: #e2e8f0;
            font-weight: 700;
        }

        /* Responzivita pre mobily */
        @media (max-width: 768px) {
            h1 { font-size: 3rem; }
            .countdown-box { flex-direction: column; gap: 25px; }
            .time-value { font-size: 4rem; }
        }
    </style>
</head>
<body>

    <!-- Snehové vločky -->
    <div class="snow-container" id="snowContainer"></div>

    <div class="container">
        <h1>Odpočet do Vianočnej dovolenky</h1>
        
        <div class="countdown-box">
            <div class="time-segment">
                <div class="time-value" id="days">00</div>
                <div class="time-label">dní</div>
            </div>
            <div class="time-segment">
                <div class="time-value" id="hours">00</div>
                <div class="time-label">hodín</div>
            </div>
            <div class="time-segment">
                <div class="time-value" id="minutes">00</div>
                <div class="time-label">minút</div>
            </div>
            <div class="time-segment seconds">
                <div class="time-value" id="seconds">00</div>
                <div class="time-label">sekúnd</div>
            </div>
        </div>
    </div>

    <script>
        // Skript na generovanie snehových vločiek
        const snowContainer = document.getElementById('snowContainer');
        const numberOfSnowflakes = 50;

        for (let i = 0; i < numberOfSnowflakes; i++) {
            const snowflake = document.createElement('div');
            snowflake.classList.add('snowflake');
            
            // Náhodná veľkosť, pozícia a rýchlosť padania
            const size = Math.random() * 4 + 2 + 'px';
            snowflake.style.width = size;
            snowflake.style.height = size;
            snowflake.style.left = Math.random() * 100 + 'vw';
            snowflake.style.animationDuration = Math.random() * 5 + 3 + 's';
            snowflake.style.animationDelay = Math.random() * 5 + 's';
            
            snowContainer.appendChild(snowflake);
        }

        // Cielový dátum: 22. december 2026, 16:00:00
