<!DOCTYPE html>
<html lang="sk">
<head>
    <charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vianočný odpočet</title>
    <!-- Google Fonts pre pekný štýl písma ako na predlohe -->
    <link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            /* Vianočné zimné pozadie (možnosť zmeniť na vlastný obrázok, tu je pekný Unsplash zimný motív) */
            background: url('https://images.unsplash.com/photo-1543589077-47d81606c1bf?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Open Sans', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            position: relative;
        }

        /* Tmavý filter cez pozadie, aby bolo všetko čitateľné */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.35);
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            max-width: 900px;
            width: 100%;
            padding: 20px;
        }

        h1 {
            font-family: 'Mountains of Christmas', cursive;
            font-size: 4.5rem;
            color: #f3f4f6;
            margin-bottom: 30px;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.6);
        }

        /* Priesvitný tmavý box presne ako na obrázku */
        .countdown-box {
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(5px);
            border-radius: 4px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 40px 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .time-segment {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }

        .time-value {
            font-size: 5rem;
            font-weight: 700;
            line-height: 1;
            color: #ffffff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.4);
        }

        /* Sekundy v ružovej farbe presne podla predlohy */
        .time-segment.seconds .time-value {
            color: #f43f5e; 
        }

        .time-label {
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 15px;
            color: #e2e8f0;
            font-weight: 700;
        }

        /* Responzivita pre mobily */
        @media (max-width: 768px) {
            h1 { font-size: 3rem; }
            .countdown-box { flex-direction: column; gap: 25px; }
            .time-value { font-size: 4rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Christmas Countdown</h1>
        
        <div class="countdown-box">
            <div class="time-segment">
                <div class="time-value" id="days">00</div>
                <div class="time-label">Days</div>
            </div>
            <div class="time-segment">
                <div class="time-value" id="hours">00</div>
                <div class="time-label">Hours</div>
            </div>
            <div class="time-segment">
                <div class="time-value" id="minutes">00</div>
                <div class="time-label">Minutes</div>
            </div>
            <div class="time-segment seconds">
                <div class="time-value" id="seconds">00</div>
                <div class="time-label">Seconds</div>
            </div>
        </div>
    </div>

    <script>
        // Cielový dátum: 22. december 2026, 16:00:00
        const targetDate = new Date("December 22, 2026 16:00:00").getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const difference = targetDate - now;

            if (difference < 0) {
                document.getElementById("days").innerText = "00";
                document.getElementById("hours").innerText = "00";
                document.getElementById("minutes").innerText = "00";
                document.getElementById("seconds").innerText = "00";
                return;
            }

            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((difference % (1000 * 60)) / 1000);

            // Pridanie nuly na začiatok, ak je číslo jednociferné
            document.getElementById("days").innerText = String(days).padStart(2, '0');
            document.getElementById("hours").innerText = String(hours).padStart(2, '0');
            document.getElementById("minutes").innerText = String(minutes).padStart(2, '0');
            document.getElementById("seconds").innerText = String(seconds).padStart(2, '0');
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>
</html>
